<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>شركة طاقات الفولاذ</title>
<style>
  :root { color-scheme: light; --o:#ff9f0a; --o2:#e68a00; --dark:#161616; --steel:#2b2f33; --bg:#f4f5f6; box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px); }
  html { scroll-behavior:smooth; scroll-padding-top:60px; }
  body { font-family:"Tajawal","Segoe UI",Tahoma,Arial,sans-serif; margin:0; background:var(--bg); color:#222; line-height:1.7; }
  nav { background:var(--dark); padding:6px 10px; text-align:center; position:sticky; top:env(safe-area-inset-top,0px); z-index:10; border-bottom:3px solid var(--o); }
  nav a { color:#fff; margin:0 4px; padding:8px 12px; text-decoration:none; display:inline-block; border-radius:8px; font-weight:700; font-size:.95rem; }
  nav a:hover { background:var(--o); color:var(--dark); }
  .hero { background:linear-gradient(160deg,#111 0%,#2b2f33 60%,#3a3f44 100%); color:#fff; text-align:center; padding:40px 20px 50px; }
  .logo { display:block; width:min(340px,86%); height:auto; margin:0 auto 22px; border-radius:18px; box-shadow:0 8px 28px rgba(0,0,0,.45); }
  .hero h1 { margin:0 0 6px; font-size:clamp(1.3rem,5.5vw,2.1rem); }
  .hero h1 span { color:var(--o); }
  .hero p { margin:0 0 24px; color:#cfd3d6; }
  .btn { background:var(--o); color:var(--dark); padding:14px 30px; border-radius:50px; text-decoration:none; display:inline-block; font-weight:700; box-shadow:0 4px 14px rgba(255,159,10,.4); transition:.2s; }
  .btn:hover { background:var(--o2); transform:translateY(-2px); }
  section { padding:34px 0 10px; }
  h2.t { text-align:center; margin:0 0 20px; font-size:1.5rem; }
  h2.t::after { content:""; display:block; width:60px; height:4px; background:var(--o); border-radius:4px; margin:8px auto 0; }
  .grid { display:flex; gap:16px; margin:0; overflow-x:auto; padding:10px 20px 20px; scroll-snap-type:x proximity; }
  .grid::-webkit-scrollbar { display:none; }
  .frame { width:230px; height:130px; border-radius:18px; flex:0 0 auto; background:linear-gradient(145deg,#3a3f44,#17191b); color:#fff; display:flex; align-items:center; justify-content:center; text-align:center; padding:10px; font-size:1.25rem; font-weight:700; box-shadow:0 4px 12px rgba(0,0,0,.22); border-bottom:5px solid var(--o); box-sizing:border-box; scroll-snap-align:center; transition:.2s; }
  .frame:hover { transform:translateY(-4px); }
  .card { background:#fff; max-width:640px; margin:0 20px; padding:24px; border-radius:18px; box-shadow:0 3px 14px rgba(0,0,0,.08); text-align:center; }
  @media (min-width:700px) { .card { margin:0 auto; } }
  .card p { margin:6px 0; }
  .contact { display:flex; flex-direction:column; gap:10px; max-width:640px; margin:0 20px; }
  @media (min-width:700px) { .contact { margin:0 auto; flex-direction:row; } .contact .c { flex:1; } }
  .c { background:#fff; border-radius:18px; padding:18px; text-align:center; box-shadow:0 3px 14px rgba(0,0,0,.08); border-top:4px solid var(--o); }
  .c b { display:block; color:var(--o2); margin-bottom:4px; }
  footer { background:var(--dark); color:#aaa; text-align:center; padding:20px; margin-top:40px; border-top:3px solid var(--o); font-size:.9rem; }
  footer p { margin:0; }

  a, .frame, .c { -webkit-tap-highlight-color:transparent; }
  nav a { transition:transform .12s ease, background .2s, color .2s; }
  .btn { transition:transform .12s ease, box-shadow .12s ease, background .2s; }
  nav a:active { transform:scale(.88); background:var(--o); color:var(--dark); }
  .btn:active { transform:scale(.92); box-shadow:0 1px 4px rgba(255,159,10,.4); background:var(--o2); }
  .frame:active { transform:scale(.95); }
  .c { transition:transform .12s ease; }
  .c:active { transform:scale(.96); }
  .frame.pic { background:#fff; padding:6px; }
  .frame.pic img { width:100%; height:100%; object-fit:contain; display:block; }
  .frame.fill { padding:0; }
  .frame.fill img { object-fit:cover; }
  .frame { overflow:hidden; }
  .frame.fill img { border-radius:0; }

  /* تصفح أفقي بصفحات: كل صفحة 4 أنواع */
  .grid { display:flex; gap:0; padding:10px 0 6px; max-width:640px; margin:0 auto; overflow-x:auto; scroll-snap-type:x mandatory; scrollbar-width:none; }
  .slide { flex:0 0 100%; scroll-snap-align:start; scroll-snap-stop:always; display:grid; grid-template-columns:1fr 1fr; gap:12px; padding:0 20px; box-sizing:border-box; align-content:start; }
  .slide .frame { width:auto; height:auto; aspect-ratio:16/10; }
  .dots { display:flex; justify-content:center; gap:10px; padding:6px 0 20px; }
  .dot { width:12px; height:12px; padding:0; border:0; border-radius:50%; background:#c4c8cc; transition:.2s; position:relative; }
  .dot::after { content:""; position:absolute; inset:-12px; }
  .dot.on { background:var(--o); width:30px; border-radius:8px; }

  /* انتقال حديث */
  .grid { scroll-behavior:smooth; overscroll-behavior-x:contain; -webkit-overflow-scrolling:touch; }
  .slide { opacity:var(--o2s,1); transform:scale(var(--sc,1)); transition:opacity .15s linear; will-change:transform,opacity; }
  .slide .frame { transition:transform .35s cubic-bezier(.22,1,.36,1), box-shadow .35s; box-shadow:0 6px 16px rgba(0,0,0,.14); }
  .slide.cur .frame { animation:pop .5s cubic-bezier(.22,1,.36,1) backwards; }
  .slide.cur .frame:nth-child(2) { animation-delay:.05s } .slide.cur .frame:nth-child(3) { animation-delay:.1s } .slide.cur .frame:nth-child(4) { animation-delay:.15s }
  @keyframes pop { from { opacity:.0; transform:translateY(14px) scale(.96); } to { opacity:1; transform:none; } }
  .dot { transition:width .4s cubic-bezier(.22,1,.36,1), background .3s; }
  .dot.on { box-shadow:0 2px 8px rgba(255,159,10,.5); }
  .dots { align-items:center; }
  .nav-btn { width:44px; height:44px; border:0; border-radius:50%; background:#fff; color:var(--dark); font-size:1.3rem; font-weight:700; box-shadow:0 2px 10px rgba(0,0,0,.18); transition:transform .15s, opacity .3s, background .2s; padding:0; }
  .nav-btn:active { transform:scale(.88); background:var(--o); }
  .nav-btn[disabled] { opacity:.3; }
  @media (prefers-reduced-motion:reduce) { .grid { scroll-behavior:auto; } .slide { transform:none !important; } .slide.cur .frame { animation:none; } }

  /* أنميشن الضغط على الصورة */
  .slide .frame { position:relative; user-select:none; -webkit-user-select:none; touch-action:pan-x pan-y; transition:transform .35s cubic-bezier(.34,1.56,.64,1), box-shadow .2s, filter .2s; }
  .slide .frame:active { transform:scale(.92); box-shadow:0 2px 6px rgba(0,0,0,.2); filter:brightness(.92); transition:transform .1s ease-out, box-shadow .1s, filter .1s; }
  .frame .rip { position:absolute; border-radius:50%; background:rgba(255,159,10,.55); transform:scale(0); pointer-events:none; animation:rip .6s ease-out forwards; }
  @keyframes rip { to { transform:scale(1); opacity:0; } }
  @media (prefers-reduced-motion:reduce) { .slide .frame:active { transform:none; } .frame .rip { display:none; } }
  a.c { display:block; color:inherit; text-decoration:none; cursor:pointer; }
  a.c span { font-weight:700; font-size:1.1rem; }
  .gm { display:block; margin:0 auto 6px; }
</style>
</head>
